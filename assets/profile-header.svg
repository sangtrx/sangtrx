<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Sang Truong — Senior AI Engineer and Applied AI Lead</title>
  <desc id="desc">Dark premium profile banner with blue and cyan light, subtle technical grid, and Sang Truong's professional positioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.52" stop-color="#07111f"/>
      <stop offset="1" stop-color="#061728"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1070 42) rotate(145) scale(520 300)">
      <stop offset="0" stop-color="#20B8FF" stop-opacity="0.34"/>
      <stop offset="0.46" stop-color="#087CFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#087CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 350) rotate(-28) scale(450 230)">
      <stop offset="0" stop-color="#79E3FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#79E3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="142" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79E3FF"/>
      <stop offset="0.55" stop-color="#20B8FF"/>
      <stop offset="1" stop-color="#087CFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91A5BA" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glowB)"/>

  <g opacity="0.7" filter="url(#soft)">
    <ellipse cx="1095" cy="70" rx="190" ry="74" fill="#20B8FF" fill-opacity="0.12"/>
  </g>

  <g fill="none" stroke="#79E3FF" stroke-opacity="0.11">
    <circle cx="1110" cy="88" r="112"/>
    <circle cx="1110" cy="88" r="158"/>
    <circle cx="1110" cy="88" r="207"/>
    <path d="M930 89H1268M1110 -80V258"/>
  </g>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="94" y="90" fill="#79E3FF" font-size="14" font-weight="700" letter-spacing="4.5">SENIOR AI ENGINEER · APPLIED AI LEAD</text>

    <text x="92" y="180" fill="#F7FCFF" font-size="72" font-weight="760" letter-spacing="-2.2">SANG TRUONG</text>

    <rect x="94" y="210" width="348" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="94" y="258" fill="#C8D7E8" font-size="22" font-weight="450" letter-spacing="0.25">Building intelligent systems from research to production.</text>

    <text x="94" y="300" fill="#91A5BA" font-size="14" font-weight="520" letter-spacing="1.05">AGENTS  /  COMPUTER VISION  /  QUANT SYSTEMS  /  MULTIMODAL RESEARCH</text>
  </g>

  <g transform="translate(1110 89)">
    <circle r="28" fill="#07182A" stroke="#79E3FF" stroke-opacity="0.36"/>
    <circle r="8" fill="#79E3FF"/>
    <circle r="15" fill="none" stroke="#20B8FF" stroke-opacity="0.42"/>
    <path d="M-56 0H-22M22 0H56M0-56V-22M0 22V56" stroke="#79E3FF" stroke-opacity="0.34" stroke-linecap="round"/>
  </g>

  <rect width="1280" height="360" rx="28" fill="transparent" filter="url(#grain)" opacity="0.9"/>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="27.25" fill="none" stroke="#A8DFFF" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
